<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <script>
      // Il sito parte con il tema scuro (src/theme.ts). Chi sceglie il chiaro con il pulsante sole/luna se lo ritrova
      // salvato. L'attributo si imposta prima del primo disegno, così non c'è nessun lampo.
      (function () {
        var t = null;
        try { t = localStorage.getItem('ks01-theme'); } catch (e) {}
        if (t !== 'light') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
      })();
    </script>
    <title>Guida per chi presenta · Missione KS-01</title>
    <meta name="description" content="Guida semplice per chi presenta Missione KS-01 all'Open Day del Vallauri: cosa fa ogni sezione, cosa dire, il codice." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/speaker/main.tsx"></script>
  </body>
</html>
